<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>BloomPOS Print Agent</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f7f9;
    color: #1f2430;
  }
  h1 {
    font-size: 16px;
    margin: 0 0 2px;
  }
  .subtitle {
    font-size: 12px;
    color: #6b7280;
    margin: 0 0 16px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: #e6f7ee;
    color: #0f7a45;
    margin-bottom: 16px;
  }
  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #14b866;
  }
  .card {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    padding: 14px;
  }
  .printer-list {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  label.printer-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  label.printer-row:hover {
    background: #f3f4f6;
  }
  .empty {
    font-size: 13px;
    color: #6b7280;
    padding: 8px;
  }
  button {
    margin-top: 14px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: #16a34a;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    background: #9ca3af;
    cursor: default;
  }
  .saved-msg {
    font-size: 12px;
    color: #16a34a;
    text-align: center;
    margin-top: 8px;
    min-height: 16px;
  }
</style>
</head>
<body>
  <h1>BloomPOS Print Agent</h1>
  <p class="subtitle">Pick the printer your online POS should print receipts to.</p>
  <div class="status"><span class="dot"></span>Running on port 41205</div>

  <div class="card">
    <div id="printerList" class="printer-list">
      <div class="empty">Loading printers…</div>
    </div>
    <button id="saveBtn" disabled>Save as Default Printer</button>
    <div id="savedMsg" class="saved-msg"></div>
  </div>

  <script>
    const printerListEl = document.getElementById('printerList');
    const saveBtn = document.getElementById('saveBtn');
    const savedMsg = document.getElementById('savedMsg');
    let selected = null;

    function renderPrinters(printers, current) {
      selected = current;
      if (!printers.length) {
        printerListEl.innerHTML = '<div class="empty">No printers found on this PC. Plug in / install your receipt printer\'s driver, then reopen this window.</div>';
        saveBtn.disabled = true;
        return;
      }
      printerListEl.innerHTML = '';
      printers.forEach((name) => {
        const row = document.createElement('label');
        row.className = 'printer-row';
        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = 'printer';
        radio.value = name;
        radio.checked = name === current;
        radio.addEventListener('change', () => {
          selected = name;
          saveBtn.disabled = false;
        });
        row.appendChild(radio);
        row.appendChild(document.createTextNode(name));
        printerListEl.appendChild(row);
      });
      saveBtn.disabled = false;
    }

    async function load() {
      const [printers, config] = await Promise.all([
        window.printAgentAPI.getPrinters(),
        window.printAgentAPI.getConfig(),
      ]);
      renderPrinters(printers, config.defaultPrinter);
    }

    saveBtn.addEventListener('click', async () => {
      if (!selected) return;
      saveBtn.disabled = true;
      await window.printAgentAPI.saveConfig({ defaultPrinter: selected });
      savedMsg.textContent = 'Saved — receipts will print to "' + selected + '"';
      setTimeout(() => { savedMsg.textContent = ''; }, 4000);
    });

    window.printAgentAPI.onConfigUpdated((config) => {
      selected = config.defaultPrinter;
    });

    load();
  </script>
</body>
</html>
